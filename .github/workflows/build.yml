name: Build Android APK

on:
  workflow_dispatch:
  push:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.34

      - name: Accept Android SDK license
        run: |
          sed -i.bak \
            "s/# android.accept_sdk_license = False/android.accept_sdk_license = True/" \
            buildozer.spec

      - name: Download Android SDK, NDK and p4a
        run: |
          buildozer android p4a -- --help

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt -y install automake libltdl-dev

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hello-meshach-apk
          path: bin/*.apk
